name: Comprobaciones del portafolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar JavaScript
        run: node --check script.js
      - name: Comprobar archivos esenciales
        run: |
          test -s index.html
          test -s styles.css
          test -s README.md
